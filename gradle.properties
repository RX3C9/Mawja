android.useAndroidX=true
kotlin.code.style=official
# Increase memory for R8/ProGuard and Kotlin compiler daemon
org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=1536m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx7g -XX:MaxMetaspaceSize=1024m
org.gradle.workers.max=4
org.gradle.caching=true
org.gradle.configuration-cache=true

# The version the next release will carry; nightly builds are named <this>-nightly.<run>+<sha>.
flow.nightlyBaseVersion=3.0.0

