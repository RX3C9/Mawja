name: Mawja Test Lab

# Fast real-device playback re-check: reuses the APKs of a finished "Mawja" run (no rebuild) and runs
# scripts/ci/testlab.sh on Firebase Test Lab (free Spark quota).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Mawja run id whose mawja-debug-apks artifact to test"
        required: true
      fetch:
        description: "Only re-read results at <bucket>/<dir> (no device run)"
        required: false
        default: ""

jobs:
  testlab:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    env:
      MAWJA_SA_B64: ${{ secrets.MAWJA_SA_B64 }}
      MAWJA_TL_FETCH: ${{ inputs.fetch }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: mawja-debug-apks
          path: apks
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Game loop on a real phone + a virtual one
        run: bash scripts/ci/testlab.sh
